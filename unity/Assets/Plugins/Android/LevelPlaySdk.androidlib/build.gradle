apply plugin: 'com.android.library'

// The LevelPlay Unity package ships only the bridge; this adds the Android SDK it compiles against.
// Keep the version in step with com.unity.services.levelplay in Packages/manifest.json.
android {
    namespace 'com.policepursuit.adsdk'
    compileSdk 34
    defaultConfig { minSdk 24 }
}

// `api`, not `implementation`: the bridge is compiled in unityLibrary, which must see these classes.
dependencies {
    api 'com.unity3d.ads-mediation:mediation-sdk:9.6.0'
    api 'com.google.android.gms:play-services-appset:16.0.2'
    api 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    api 'com.google.android.gms:play-services-basement:18.1.0'
}

name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exportType: [androidPackage, androidAppBundle]
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. Run the create-keystore workflow first (DEPLOYMENT §5)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Car and city models: their licence keeps them out of this public repository.
      - uses: actions/checkout@v4
        with:
          repository: Organexa/police-pursuit-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: unity/Assets/ThirdParty
          persist-credentials: false
      - name: Firebase config for push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 .github/scripts/firebase_res.py
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.29f1
          # GameCI publishes no version 3 images (the action default) for this Unity release.
          containerRegistryImageVersion: 4
          targetPlatform: Android
          buildName: PolicePursuit
          androidExportType: ${{ matrix.exportType }}
          androidVersionCode: ${{ github.run_number }}
          # Compared with app_config by the update notice: raise it for each release.
          versioning: Custom
          version: 1.0.0
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.exportType }}
          path: |
            build/Android/*.apk
            build/Android/*.aab
          if-no-files-found: error

  release:
    # A public download only when a version tag is pushed; builds of main stay as run artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*

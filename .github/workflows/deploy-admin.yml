name: deploy-admin

on:
  push:
    branches: [main]
    paths: ['admin/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin
      # GitHub can take a while to list a fresh artifact (actions/deploy-pages issue 451). If it still
      # fails, start a new run: re-running the job uploads a second artifact and fails for good.
      - run: sleep 60
      - id: deployment
        uses: actions/deploy-pages@v4

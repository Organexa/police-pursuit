name: android-check

# A test APK from a feature branch: proves the Android plugins and SDKs compile. Debug-signed until the
# keystore exists, then signed with the upload key. Releases still come from build.yml.
on:
  push:
    branches-ignore: [main]
    paths: ['unity/**', '.github/workflows/android-check.yml']
  workflow_dispatch: # to rebuild after a secret changes, with no code change

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.29f1
          containerRegistryImageVersion: 4
          targetPlatform: Android
          buildName: PolicePursuit
          androidExportType: androidPackage
          versioning: Custom
          version: 1.0.0
          # Once create-keystore has run, sign with the upload key so every test build has the same
          # fingerprint (Google sign-in checks it). Until then these are empty and a debug key is used.
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'upload.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 3

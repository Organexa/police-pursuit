name: create-keystore

on: workflow_dispatch

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      BACKUP_PASS: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$BACKUP_PASS" ]; then
            echo "::error::Add GH_SECRETS_TOKEN and KEYSTORE_BACKUP_PASSPHRASE first (DEPLOYMENT §5)."
            exit 1
          fi
          # A token without the Secrets permission would otherwise only fail half-way through the next step.
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" >/dev/null 2>err.txt; then
            echo "::error::GH_SECRETS_TOKEN cannot manage this repository's secrets: $(head -c 300 err.txt). Give it Repository permissions > Secrets: Read and write on this repository."
            exit 1
          fi
          if gh secret list -R "$GITHUB_REPOSITORY" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            echo "::error::A keystore already exists. Refusing to overwrite it (it would break Play uploads)."
            exit 1
          fi
      - name: Create keystore, save secrets, encrypt backup
        run: |
          set -Eeuo pipefail
          # Names the failing command as written (variables are not expanded, so no secret is printed).
          trap 'echo "::error::Failed command: $BASH_COMMAND"' ERR
          umask 077
          STORE_PASS=$(openssl rand -base64 48 | tr -d '/+=\n' | cut -c1-32)
          echo "::add-mask::$STORE_PASS"
          ALIAS=upload
          keytool -genkeypair -keystore upload.keystore -storetype PKCS12 -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=Police Pursuit"
          base64 -w0 upload.keystore | gh secret set ANDROID_KEYSTORE_BASE64 -R "$GITHUB_REPOSITORY"
          printf '%s' "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASS -R "$GITHUB_REPOSITORY"
          printf '%s' "$ALIAS"      | gh secret set ANDROID_KEYALIAS_NAME -R "$GITHUB_REPOSITORY"
          printf '%s' "$STORE_PASS" | gh secret set ANDROID_KEYALIAS_PASS -R "$GITHUB_REPOSITORY"
          printf 'alias=%s\nstore_password=%s\nkey_password=%s\n' "$ALIAS" "$STORE_PASS" "$STORE_PASS" > passwords.txt
          tar czf - upload.keystore passwords.txt \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASS -out keystore-backup.tar.gz.enc
          echo "Upload key fingerprints (public, needed for Google sign-in test builds):"
          keytool -list -v -keystore upload.keystore -storepass "$STORE_PASS" | grep -E 'SHA1:|SHA256:'
          shred -u upload.keystore passwords.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore-backup.tar.gz.enc
          retention-days: 1

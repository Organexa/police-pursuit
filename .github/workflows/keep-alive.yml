name: keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read app_config so Supabase doesn't pause
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY variables not set yet. Skipping."
            exit 0
          fi
          curl -fsS -o /dev/null "$URL/rest/v1/app_config?select=id&limit=1" -H "apikey: $KEY"

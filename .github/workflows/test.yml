name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check Unity license
        id: ready
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::notice::UNITY_LICENSE secret not set yet (DEPLOYMENT §4). Skipping Unity tests."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.ready.outputs.go == 'true'
        with:
          path: unity/Library
          key: Library-test-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4.3.2
        if: steps.ready.outputs.go == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.29f1
          # GameCI publishes no version 3 images (the action default) for this Unity release.
          containerRegistryImageVersion: 4
          testMode: all
      # Keep the test results even when tests fail: the log only shows Unity's exit code, not which tests failed.
      - uses: actions/upload-artifact@v4
        if: always() && steps.ready.outputs.go == 'true'
        with:
          name: unity-test-results
          path: artifacts
          retention-days: 7
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        if: hashFiles('supabase/functions/**/*.ts') != ''
        with:
          deno-version: v2.x
      - name: Edge Function tests
        if: hashFiles('supabase/functions/**/*.ts') != ''
        run: deno test --allow-all supabase/functions
      - uses: supabase/setup-cli@v1
        if: hashFiles('supabase/config.toml') != ''
        with:
          version: latest
      - name: RLS tests
        if: hashFiles('supabase/config.toml') != ''
        run: |
          supabase start
          supabase test db
